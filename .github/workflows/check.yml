name: Config check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for secrets
        run: |
          if grep -rniE "password|secret" --include="*.cfg" .; then
            echo "Possible secret found!"
            exit 1
          fi
      - name: Every switch config has a hostname
        run: |
          for f in switches/*.cfg; do
            grep -qi "hostname" "$f" || { echo "No hostname in $f"; exit 1; }
          done
