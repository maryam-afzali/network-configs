name: Config check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every switch config has a hostname
        run: |
          for f in switches/*.cfg; do
            [ -e "$f" ] || { echo "No config files found"; exit 1; }
  deploy-demo:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-core
      - run: ansible-playbook playbooks/demo.yml
            grep -qi "^hostname" "$f" || { echo "No hostname in $f"; exit 1; }
          done
